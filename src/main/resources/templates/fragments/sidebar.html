<div th:fragment="sidebar" class="w-72 bg-univ-navy text-white flex flex-col justify-between shadow-2xl z-30 flex-shrink-0 border-r border-univ-gold/20">
    <div>
        <div class="p-6 border-b border-white/10 flex flex-col items-center">
            <div class="flex items-center space-x-3">
                <svg class="w-10 h-10 text-univ-gold" viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
                    <path d="M25 65 C20 50,25 35,35 25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    <path d="M75 65 C80 50,75 35,65 25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    <path d="M35 60 L50 65 L65 60 L65 45 L50 50 L35 45 Z" fill="currentColor" opacity="0.8"/>
                    <path d="M48 75 L52 75 L53 52 L47 52 Z" fill="#fff"/>
                    <path d="M45 48 C48 40,52 40,55 48 C51 44,49 44,45 48 Z" fill="url(#torch-flame)"/>
                    <defs><linearGradient id="torch-flame" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#bfa15f"/><stop offset="100%" stop-color="#fff"/></linearGradient></defs>
                </svg>
                <div class="leading-tight">
                    <span class="block font-bold text-xs tracking-wider uppercase">Université de</span>
                    <span class="block font-serif text-lg font-light tracking-wide text-univ-gold">l'Excellence</span>
                </div>
            </div>
            <div class="mt-2 text-[9px] text-univ-gold/60 uppercase tracking-widest font-semibold">Portail</div>
        </div>
        <nav class="mt-6 px-4 space-y-1" th:switch="${role}">
            <!-- Liens communs à tous -->
            <a th:href="@{/dashboard}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-chart-pie w-5"></i><span>Tableau de bord</span></a>

            <!-- Étudiant -->
            <div th:case="'ETUDIANT'">
                <a th:href="@{/etudiant/historique}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-history w-5"></i><span>Mon historique</span></a>
                <a th:href="@{/etudiant/credits}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-certificate w-5"></i><span>Mes crédits</span></a>
                <a th:href="@{/etudiant/sanctions}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-gavel w-5"></i><span>Sanctions</span></a>
                <a th:href="@{/etudiant/etablissements}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-building w-5"></i><span>Établissements antérieurs</span></a>
            </div>

            <!-- Agent -->
            <div th:case="'AGENT'">
                <a th:href="@{/agent/etudiants/recherche}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-search w-5"></i><span>Rechercher étudiant</span></a>
                <a th:href="@{/agent/notes/ajouter}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-pen w-5"></i><span>Ajouter note</span></a>
                <a th:href="@{/agent/sanctions/ajouter}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-exclamation-triangle w-5"></i><span>Ajouter sanction</span></a>
                <a th:href="@{/agent/parcours/valider}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-check-circle w-5"></i><span>Valider parcours</span></a>
            </div>

            <!-- Commission -->
            <div th:case="'COMMISSION'">
                <a th:href="@{/commission/ue/liste}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-list w-5"></i><span>Unités d'enseignement</span></a>
                <a th:href="@{/commission/comparer}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-scale-balanced w-5"></i><span>Comparer programmes</span></a>
            </div>

            <!-- Administration centrale -->
            <div th:case="'ADMIN'">
                <a th:href="@{/admin/statistiques}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-chart-line w-5"></i><span>Statistiques</span></a>
                <!-- les autres liens admin déjà présents -->
            </div>

            <a th:href="@{/templates/etudiant/profil}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition"><i class="fa-solid fa-user-circle w-5"></i><span>Mon profil</span></a>
            <a th:href="@{/auth/logout}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-rose-300 hover:bg-rose-500/10 hover:text-rose-100 transition"><i class="fa-solid fa-power-off w-5"></i><span>Déconnexion</span></a>
        </nav>
    </div>
</div>
