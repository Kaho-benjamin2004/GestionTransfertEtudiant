<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Mon profil</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>
<body class="bg-gray-100">
<div class="max-w-2xl mx-auto p-6 mt-10 bg-white rounded-xl shadow">
    <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold text-univ-navy">Profil</h2><a th:href="@{/profile/edit}" class="text-univ-gold"><i class="fas fa-edit"></i> Modifier</a></div>
    <div class="space-y-3">
        <p><strong>Nom :</strong> <span th:text="${user.profil.nom}"></span></p>
        <p><strong>Prénom :</strong> <span th:text="${user.profil.prenom}"></span></p>
        <p><strong>Email :</strong> <span th:text="${user.profil.email}"></span></p>
        <p><strong>Téléphone :</strong> <span th:text="${user.profil.telephone}"></span></p>
        <p><strong>Matricule :</strong> <span th:text="${user.profil.matriculeNational}"></span></p>
        <p><strong>Fonction :</strong> <span th:text="${user.profil.fonction}"></span></p>
    </div>
    <div class="mt-6"><a th:href="@{/auth/change-password}" class="text-univ-navy underline">Changer mot de passe</a></div>
</div>
</body>
</html>
