<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Changer mot de passe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans&display=swap" rel="stylesheet">
    <script>let tailwind;
    tailwind.config={theme:{extend:{colors:{univ:{navy:'#133054',gold:'#bfa15f'}}}}}</script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-2xl shadow-xl w-96">
    <h2 class="text-2xl font-bold text-univ-navy mb-6">Changer mot de passe</h2>
    <form th:action="@{/auth/change-password}" th:object="${changementRequest}" method="post">
        <div class="mb-4"><label>Ancien mot de passe</label><input type="password" th:field="*{ancienMotDePasse}" class="w-full border rounded p-2" required></div>
        <div class="mb-4"><label>Nouveau mot de passe</label><input type="password" th:field="*{nouveauMotDePasse}" class="w-full border rounded p-2" required></div>
        <button type="submit" class="bg-univ-navy text-white px-4 py-2 rounded w-full">Modifier</button>
    </form>
    <div class="mt-4 text-center"><a th:href="@{/dashboard}" class="text-univ-gold">Retour au tableau de bord</a></div>
</div>
</body>
</html>
