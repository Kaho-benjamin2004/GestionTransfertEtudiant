<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Mes sessions</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>
<body class="bg-gray-100">
<div class="container mx-auto p-6">
    <h1 class="text-2xl font-bold text-univ-navy mb-4">Sessions actives</h1>
    <div class="bg-white rounded shadow overflow-hidden">
        <table class="min-w-full"><thead class="bg-gray-800 text-white"><tr><th>Token (masqué)</th><th>Début</th><th>Adresse IP</th><th>User Agent</th></tr></thead>
            <tbody><tr th:each="s : ${sessions}"><td th:text="${s.token}">...</td><td th:text="${s.dateDebut}">date</td><td th:text="${s.adresseIP}">ip</td><td th:text="${s.userAgent}">agent</td></tr></tbody></table>
    </div>
</div>
</body>
</html>
