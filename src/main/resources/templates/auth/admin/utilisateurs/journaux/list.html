<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Journaux de connexion</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100">
<div class="container mx-auto p-6">
    <h1 class="text-2xl font-bold text-univ-navy">Historique des connexions</h1>
    <div class="mt-4 bg-white rounded shadow overflow-x-auto">
        <table class="min-w-full"><thead class="bg-gray-800 text-white"><tr><th>Date</th><th>Succès</th><th>IP</th><th>Raison échec</th><th>Utilisateur</th></tr></thead>
            <tbody><tr th:each="j : ${journaux.content}"><td th:text="${j.dateHeure}">date</td><td><span th:if="${j.succes}" class="text-green-600">✓</span><span th:unless="${j.succes}" class="text-red-600">✗</span></td><td th:text="${j.adresseIP}">ip</td><td th:text="${j.raisonEchec}">-</td><td th:text="${j.utilisateurId}">uuid</td></tr></tbody></table>
    </div>
</div>
</body>
</html>
