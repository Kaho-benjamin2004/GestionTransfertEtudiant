<!DOCTYPE html>
<html lang="fr" class="h-full" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Université de l'Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { univ: { navy: '#133054', gold: '#bfa15f', navyLight: '#1d4270', goldLight: '#d2b67a', bg: '#f8fafc' } },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] }
                }
            }
        }
    </script>
    <style>body{font-family:'Plus Jakarta Sans',sans-serif}.bg-campus-blur{background-image:linear-gradient(rgba(19,48,84,0.4),rgba(15,23,42,0.45)),url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=1470&auto=format&fit=crop');background-size:cover;background-position:center;}</style>
</head>
<body class="bg-campus-blur min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white rounded-[24px] shadow-2xl overflow-hidden">
    <div class="p-6 pb-4 border-b border-slate-100 flex flex-col items-center bg-white">
        <div class="flex items-center space-x-3">
            <svg class="w-12 h-12 text-univ-navy" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
                <path d="M25 65 C20 50,25 35,35 25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <path d="M75 65 C80 50,75 35,65 25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <path d="M35 60 L50 65 L65 60 L65 45 L50 50 L35 45 Z" fill="currentColor" opacity="0.8"/>
                <path d="M48 75 L52 75 L53 52 L47 52 Z" fill="#bfa15f"/>
                <path d="M45 48 C48 40,52 40,55 48 C51 44,49 44,45 48 Z" fill="url(#torch-flame)"/>
                <defs><linearGradient id="torch-flame" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#bfa15f"/><stop offset="100%" stop-color="#ffedd5"/></linearGradient></defs>
            </svg>
            <div class="leading-tight text-left"><span class="block font-bold text-xs tracking-widest uppercase text-univ-navy">Université de</span><span class="block serif-title text-xl font-bold tracking-wide text-univ-gold">l'Excellence</span></div>
        </div>
    </div>

    <div class="p-8 space-y-6">
        <div class="text-center"><h2 class="text-xl font-bold text-univ-navy">Bienvenue</h2><p class="text-xs text-slate-500">Connectez-vous à votre portail universitaire sécurisé</p></div>

        <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post" class="space-y-4">
            <div class="space-y-1">
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider">Login</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-regular fa-user text-sm"></i></span>
                    <input type="text" name="username" th:field="*{username}" required placeholder="Votre login" class="w-full pl-10 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-univ-gold focus:outline-none bg-slate-50/50">
                </div>
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider">Mot de passe</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-lock text-sm"></i></span>
                    <input type="password"  name="password" th:field="*{password}" required class="w-full pl-10 pr-10 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-univ-gold focus:outline-none bg-slate-50/50">
                    <button type="button" onclick="togglePassword(this)" class="absolute inset-y-0 right-0 pr-3.5 text-slate-400"><i class="fa-regular fa-eye-slash text-sm"></i></button>
                </div>
            </div>
            <div th:if="${param.error}" class="bg-red-100 text-red-700 p-2 rounded text-xs">username ou mot de passe incorrect</div>
            <div th:if="${param.success}" class="bg-green-100 text-green-700 p-2 rounded text-xs" th:text="${param.success}"></div>
            <button type="submit" class="w-full py-3.5 bg-univ-navy hover:bg-univ-navyLight text-white font-bold text-xs tracking-wider uppercase rounded-xl shadow-lg">Se connecter <i class="fa-solid fa-right-to-bracket ml-2"></i></button>
        </form>

        <div class="pt-4 border-t border-slate-100 text-center text-xs">
            <a th:href="@{/auth/register}" class="text-univ-gold hover:underline">Créer un compte</a> |
            <a href="#" onclick="openForgotModal()" class="text-univ-gold hover:underline">Mot de passe oublié ?</a>
        </div>
    </div>
</div>

<!-- Modal Forgot Password (similaire à l'exemple) -->
<div id="forgot-modal" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-[24px] max-w-sm w-full p-6 space-y-4"><button onclick="closeForgotModal()" class="float-right text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
        <h3 class="font-bold text-lg text-univ-navy">Réinitialisation</h3>
        <form th:action="@{/auth/forgot-password}" method="post"><input type="email" name="email" placeholder="Email universitaire" class="w-full border rounded-xl p-3 text-sm" required><button class="mt-4 w-full bg-univ-navy text-white py-2 rounded-xl">Envoyer</button></form>
    </div>
</div>
<script>function togglePassword(btn){let input=btn.previousElementSibling;let icon=btn.querySelector('i');if(input.type==='password'){input.type='text';icon.classList.remove('fa-eye-slash');icon.classList.add('fa-eye');}else{input.type='password';icon.classList.add('fa-eye-slash');icon.classList.remove('fa-eye');}}function openForgotModal(){document.getElementById('forgot-modal').classList.remove('hidden');}function closeForgotModal(){document.getElementById('forgot-modal').classList.add('hidden');}</script>
</body>
</html>
