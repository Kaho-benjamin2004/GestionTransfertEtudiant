<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Université de l'Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        univ: { navy: '#133054', gold: '#bfa15f', navyLight: '#1d4270', goldLight: '#d2b67a', bg: '#f8fafc' }
                    },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-campus-blur {
            background-image: linear-gradient(rgba(19,48,84,0.4), rgba(15,23,42,0.45)),
            url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=1470&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-campus-blur min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-[24px] shadow-2xl overflow-hidden">
    <div class="p-6 pb-4 border-b border-slate-100 flex flex-col items-center bg-white">
        <div class="flex items-center space-x-3">
            <svg class="w-12 h-12 text-univ-navy" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
                <path d="M25 65 C20 50,25 35,35 25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <path d="M75 65 C80 50,75 35,65 25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <path d="M35 60 L50 65 L65 60 L65 45 L50 50 L35 45 Z" fill="currentColor" opacity="0.8"/>
                <path d="M48 75 L52 75 L53 52 L47 52 Z" fill="#bfa15f"/>
                <path d="M45 48 C48 40,52 40,55 48 C51 44,49 44,45 48 Z" fill="url(#torch-flame)"/>
                <defs><linearGradient id="torch-flame" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#bfa15f"/><stop offset="100%" stop-color="#ffedd5"/></linearGradient></defs>
            </svg>
            <div class="leading-tight text-left">
                <span class="block font-bold text-xs tracking-widest uppercase text-univ-navy">Université de</span>
                <span class="block serif-title text-xl font-bold tracking-wide text-univ-gold">l'Excellence</span>
                <span class="block text-[8px] tracking-widest text-slate-400 font-semibold font-mono uppercase">Fundata MCMXCVIII</span>
            </div>
        </div>
    </div>

    <div class="p-8 space-y-6">
        <div class="text-center">
            <h2 class="text-xl font-bold text-univ-navy">Créer un compte</h2>
            <p class="text-xs text-slate-500">Remplissez le formulaire ci-dessous</p>
        </div>

        <!-- Message flash (optionnel) -->
        <div th:if="${param.error}" class="bg-red-100 text-red-700 p-3 rounded-lg text-sm" th:text="${param.error}"></div>
        <div th:if="${param.success}" class="bg-green-100 text-green-700 p-3 rounded-lg text-sm" th:text="${param.success}"></div>

        <!-- FORMULAIRE -->
        <form th:action="@{/auth/register}" th:object="${registration}" method="post" class="space-y-4">
            <!-- Bloc d'erreurs de validation (OBLIGATOIREMENT à l'intérieur du formulaire) -->
            <div th:if="${#fields.hasErrors('*')}" class="bg-red-100 text-red-700 p-3 rounded-lg text-sm">
                <ul>
                    <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
                </ul>
            </div>

            <!-- Login -->
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase">Login *</label>
                <input type="text" th:field="*{utilisateurRequest.login}" required class="w-full border rounded-xl p-3 bg-white/50">
                <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('utilisateurRequest.login')}" th:errors="*{utilisateurRequest.login}"></p>
            </div>

            <!-- Mot de passe -->
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase">Mot de passe *</label>
                <input type="password" th:field="*{utilisateurRequest.motDePasse}" required class="w-full border rounded-xl p-3 bg-white/50">
                <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('utilisateurRequest.motDePasse')}" th:errors="*{utilisateurRequest.motDePasse}"></p>
            </div>

            <!-- Nom -->
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase">Nom *</label>
                <input type="text" th:field="*{utilisateurRequest.nom}" required class="w-full border rounded-xl p-3 bg-white/50">
                <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('utilisateurRequest.nom')}" th:errors="*{utilisateurRequest.nom}"></p>
            </div>

            <!-- Prénom -->
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase">Prénom *</label>
                <input type="text" th:field="*{utilisateurRequest.prenom}" required class="w-full border rounded-xl p-3 bg-white/50">
                <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('utilisateurRequest.prenom')}" th:errors="*{utilisateurRequest.prenom}"></p>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase">Email *</label>
                <input type="email" th:field="*{utilisateurRequest.email}" required class="w-full border rounded-xl p-3 bg-white/50">
                <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('utilisateurRequest.email')}" th:errors="*{utilisateurRequest.email}"></p>
            </div>

            <!-- Téléphone (optionnel) -->
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase">Téléphone</label>
                <input type="tel" th:field="*{utilisateurRequest.telephone}" class="w-full border rounded-xl p-3 bg-white/50">
            </div>

            <!-- Matricule national (optionnel) -->
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase">Matricule national</label>
                <input type="text" th:field="*{utilisateurRequest.matriculeNational}" class="w-full border rounded-xl p-3 bg-white/50">
            </div>

            <!-- Case à cocher -->
            <label class="flex items-start space-x-2 text-[11px] text-slate-500">
                <input type="checkbox" required class="mt-0.5 accent-univ-gold">
                <span>J'accepte le règlement de confidentialité et la charte d'utilisation informatique.</span>
            </label>

            <button type="submit" class="w-full py-3 bg-univ-gold text-univ-navy font-bold rounded-xl">Créer mon accès</button>
        </form>

        <div class="text-center text-xs">
            <span>Vous possédez déjà un compte ?</span>
            <a th:href="@{/auth/login}" class="text-univ-gold font-bold underline ml-1">Se connecter</a>
        </div>
    </div>
</div>
</body>
</html>
