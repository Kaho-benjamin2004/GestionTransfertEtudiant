<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mot de passe oublié - Université de l'Excellence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .bg-campus-blur {
      background-image: linear-gradient(rgba(19,48,84,0.4), rgba(15,23,42,0.45)),
      url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=1470&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="bg-campus-blur min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden">
  <div class="p-8 space-y-6">
    <h2 class="text-2xl font-bold text-center text-univ-navy">Réinitialisation du mot de passe</h2>
    <p class="text-sm text-center text-gray-600">Saisissez votre adresse email, nous vous enverrons un lien de réinitialisation.</p>
    <form th:action="@{/auth/forgot-password}" method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email *</label>
        <input type="email" name="email" required class="w-full border border-gray-300 rounded-lg px-4 py-2">
      </div>
      <button type="submit" class="w-full bg-univ-navy text-white font-bold py-2 rounded-lg hover:bg-univ-navyLight transition">
        Envoyer le lien
      </button>
    </form>
    <div class="text-center">
      <a th:href="@{/auth/login}" class="text-univ-gold hover:underline">Retour à la connexion</a>
    </div>
  </div>
</div>
</body>
</html>
