<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Détail de ma demande - Université de l Excellence')"></head>
<body class="bg-campus-blur min-h-screen">
<div class="flex h-screen overflow-hidden">
    <!-- Sidebar identique -->
    <aside class="w-72 bg-univ-navy text-white flex flex-col justify-between shadow-2xl z-30 flex-shrink-0 border-r border-univ-gold/20">
        <div>...</div> <!-- même sidebar que précédemment -->
        <div class="p-4 border-t border-white/10"><a th:href="@{/auth/logout}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-rose-300 hover:bg-rose-500/10 transition"><i class="fa-solid fa-power-off w-5"></i><span>Déconnexion</span></a></div>
    </aside>

    <div class="flex-grow flex flex-col overflow-hidden">
        <header class="h-20 bg-white/80 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-8 z-20 shadow-sm">
            <div class="flex items-center space-x-2">
                <h1 class="text-2xl font-bold text-univ-navy">Détail de la demande</h1>
                <span class="text-slate-400">/</span>
                <span class="text-slate-500 font-medium text-sm">Suivi</span>
            </div>
            <div class="flex items-center space-x-3">
                <div class="text-right hidden sm:block">
                    <span class="block text-sm font-bold text-univ-navy" th:text="${etudiant != null ? etudiant.nom + ' ' + etudiant.prenom : 'Étudiant'}">Étudiant</span>
                    <span class="block text-[11px] text-slate-500 font-medium">N° <span th:text="${etudiant != null ? etudiant.numeroEtudiant : ''}">123456</span></span>
                </div>
                <img class="w-10 h-10 rounded-full border-2 border-univ-gold object-cover shadow-sm" src="https://ui-avatars.com/api/?background=133054&color=bfa15f&bold=true&name=Student" alt="Avatar">
            </div>
        </header>

        <main class="flex-grow p-8 overflow-y-auto custom-scrollbar">
            <div class="content-card bg-white rounded-2xl shadow-sm max-w-3xl mx-auto p-6">
                <div class="flex justify-between items-start border-b border-slate-100 pb-4 mb-4">
                    <div>
                        <h2 class="text-xl font-bold text-univ-navy">Demande n° <span th:text="${demande.id}"></span></h2>
                        <p class="text-sm text-slate-500">Soumis le <span th:text="${#dates.format(demande.dateDemande, 'dd/MM/yyyy')}"></span></p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-xs font-bold"
                          th:class="${demande.statut == 'SOUMISE' ? 'bg-blue-100 text-blue-700' :
                                   (demande.statut == 'ACCEPTEE' ? 'bg-green-100 text-green-700' :
                                   (demande.statut == 'REFUSEE' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'))}"
                          th:text="${demande.statut}">Statut</span>
                </div>

                <div class="space-y-5">
                    <div>
                        <h3 class="text-md font-bold text-univ-navy">Motif</h3>
                        <p class="text-slate-700 bg-slate-50 p-3 rounded-lg" th:text="${demande.motif}">Motif...</p>
                    </div>
                    <div th:if="${demande.commentaireRefus != null}">
                        <h3 class="text-md font-bold text-red-600">Motif du refus</h3>
                        <p class="text-red-700 bg-red-50 p-3 rounded-lg" th:text="${demande.commentaireRefus}"></p>
                    </div>

                    <!-- Liste des pièces justificatives -->
                    <div>
                        <h3 class="text-md font-bold text-univ-navy flex justify-between items-center">
                            <span><i class="fas fa-paperclip mr-2 text-univ-gold"></i>Pièces jointes</span>
                            <a th:href="@{/etudiant/transferts/{id}/ajouter-pieces(id=${demande.id})}" class="text-sm bg-slate-100 hover:bg-slate-200 text-univ-navy px-3 py-1 rounded-full transition">
                                <i class="fas fa-plus"></i> Ajouter
                            </a>
                        </h3>
                        <div th:if="${demande.pieces == null or demande.pieces.empty}" class="text-slate-400 italic text-sm mt-2">
                            Aucune pièce pour le moment.
                        </div>
                        <ul th:unless="${demande.pieces == null or demande.pieces.empty}" class="list-disc list-inside space-y-1 mt-2">
                            <li th:each="p : ${demande.pieces}">
                                <span th:text="${p.nomFichier}"></span> (<span th:text="${p.type}"></span>)
                                <a th:href="@{/uploads/{chemin}(chemin=${p.chemin})}" class="text-univ-gold text-sm ml-2"><i class="fas fa-download"></i> Télécharger</a>
                            </li>
                        </ul>
                    </div>

                    <!-- Historique des audits (étapes) -->
                    <div th:if="${demande.audits != null and !demande.audits.empty}">
                        <h3 class="text-md font-bold text-univ-navy">Historique de la demande</h3>
                        <div class="border-l-2 border-univ-gold pl-4 ml-2 space-y-3 mt-2">
                            <div th:each="audit : ${demande.audits}" class="text-sm">
                                <span class="font-semibold" th:text="${audit.action}"></span> –
                                <span th:text="${#dates.format(audit.dateAction, 'dd/MM/yyyy HH:mm')}"></span>
                                <p class="text-slate-500 text-xs" th:text="${audit.details}"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex justify-end space-x-3">
                    <form th:action="@{/etudiant/transferts/{id}/soumettre(id=${demande.id})}" method="post" th:if="${demande.statut == 'BROUILLON'}">
                        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-xl hover:bg-green-700">Soumettre la demande</button>
                    </form>
                    <form th:action="@{/etudiant/transferts/{id}/annuler(id=${demande.id})}" method="post" th:if="${demande.statut == 'BROUILLON' or demande.statut == 'SOUMISE'}">
                        <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded-xl hover:bg-red-700" onclick="return confirm('Annuler définitivement cette demande ?')">Annuler</button>
                    </form>
                    <a th:href="@{/etudiant/transferts/mes-demandes}" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl">Retour</a>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
