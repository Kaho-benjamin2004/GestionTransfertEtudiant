<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Ajouter une pièce - Université de l Excellence')"></head>
<body class="bg-campus-blur min-h-screen">
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar identique -->
  <aside class="w-72 bg-univ-navy text-white flex flex-col justify-between shadow-2xl z-30 flex-shrink-0 border-r border-univ-gold/20">
    <div>...</div>
    <div class="p-4 border-t border-white/10"><a th:href="@{/auth/logout}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-rose-300 hover:bg-rose-500/10 transition"><i class="fa-solid fa-power-off w-5"></i><span>Déconnexion</span></a></div>
  </aside>

  <div class="flex-grow flex flex-col overflow-hidden">
    <header class="h-20 bg-white/80 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-8 z-20 shadow-sm">
      <div class="flex items-center space-x-2">
        <h1 class="text-2xl font-bold text-univ-navy">Ajouter une pièce justificative</h1>
        <span class="text-slate-400">/</span>
        <span class="text-slate-500 font-medium text-sm">Document</span>
      </div>
      <div class="flex items-center space-x-3">
        <div class="text-right hidden sm:block">
          <span class="block text-sm font-bold text-univ-navy" th:text="${etudiant != null ? etudiant.nom + ' ' + etudiant.prenom : 'Étudiant'}">Étudiant</span>
          <span class="block text-[11px] text-slate-500 font-medium">N° <span th:text="${etudiant != null ? etudiant.numeroEtudiant : ''}">123456</span></span>
        </div>
        <img class="w-10 h-10 rounded-full border-2 border-univ-gold object-cover shadow-sm" src="https://ui-avatars.com/api/?background=133054&color=bfa15f&bold=true&name=Student" alt="Avatar">
      </div>
    </header>

    <main class="flex-grow p-8 overflow-y-auto custom-scrollbar">
      <div class="content-card bg-white rounded-2xl shadow-sm max-w-2xl mx-auto p-6">
        <h2 class="text-xl font-bold text-univ-navy mb-4 flex items-center">
          <i class="fa-solid fa-paperclip mr-2 text-univ-gold"></i> Nouvelle pièce jointe
        </h2>
        <form th:action="@{/etudiant/transferts/{id}/ajouter-pieces(id=${demandeId})}" method="post" enctype="multipart/form-data" class="space-y-5">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Type de document *</label>
            <select name="type" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-white/80 focus:border-univ-gold focus:outline-none">
              <option value="">Sélectionnez...</option>
              <option value="RELEVE_NOTES">Relevé de notes</option>
              <option value="CIN">Carte d'identité</option>
              <option value="ATTESTATION">Attestation de réussite</option>
              <option value="AUTRE">Autre</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Fichier *</label>
            <input type="file" name="fichier" accept=".pdf,.jpg,.png" required class="w-full border border-slate-200 rounded-xl px-4 py-2 bg-white/80 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-univ-navy file:text-white hover:file:bg-univ-navyLight">
          </div>
          <div class="flex justify-end space-x-3 pt-2">
            <a th:href="@{/etudiant/transferts/{id}(id=${demandeId})}" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl">Annuler</a>
            <button type="submit" class="bg-univ-gold text-univ-navy font-bold px-6 py-2 rounded-xl shadow-sm hover:bg-univ-goldLight transition">Ajouter la pièce</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
</body>
</html>
