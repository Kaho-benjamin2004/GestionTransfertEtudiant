<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mon historique - Université de l Excellence')}"></head>
<body class="bg-campus-blur min-h-screen">
<div class="flex h-screen overflow-hidden">
    <!-- Sidebar identique -->
    <aside class="w-72 bg-univ-navy text-white flex flex-col justify-between shadow-2xl z-30 flex-shrink-0 border-r border-univ-gold/20">
        <div>
            <div class="p-6 border-b border-white/10 flex flex-col items-center">
                <div class="flex items-center space-x-3">
                    <svg class="w-10 h-10 text-univ-gold" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
                        <path d="M25 65 C20 50,25 35,35 25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        <path d="M75 65 C80 50,75 35,65 25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        <path d="M35 60 L50 65 L65 60 L65 45 L50 50 L35 45 Z" fill="currentColor" opacity="0.8"/>
                        <path d="M48 75 L52 75 L53 52 L47 52 Z" fill="#fff"/>
                        <path d="M45 48 C48 40,52 40,55 48 C51 44,49 44,45 48 Z" fill="url(#torch-flame)"/>
                        <defs><linearGradient id="torch-flame" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#bfa15f"/><stop offset="100%" stop-color="#fff"/></linearGradient></defs>
                    </svg>
                    <div class="leading-tight">
                        <span class="block font-bold text-xs tracking-wider uppercase">Université de</span>
                        <span class="block font-serif text-lg font-light tracking-wide text-univ-gold">l'Excellence</span>
                    </div>
                </div>
                <div class="mt-2 text-[9px] text-univ-gold/60 uppercase tracking-widest font-semibold">Portail Étudiant</div>
            </div>
            <nav class="mt-6 px-4 space-y-1">
                <a th:href="@{/dashboard}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition"><i class="fa-solid fa-chart-pie w-5"></i><span>Tableau de bord</span></a>
                <a th:href="@{/etudiant/historique}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition"><i class="fa-solid fa-history w-5"></i><span>Mon historique</span></a>
                <a th:href="@{/etudiant/credits}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition"><i class="fa-solid fa-graduation-cap w-5"></i><span>Mes crédits</span></a>
                <a th:href="@{/etudiant/sanctions}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition"><i class="fa-solid fa-exclamation-triangle w-5"></i><span>Mes sanctions</span></a>
                <a th:href="@{/etudiant/profil/view}" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-univ-gold text-univ-navy font-semibold shadow-md"><i class="fa-solid fa-user-circle w-5"></i><span>Mon profil</span></a>
            </nav>
        </div>
        <div class="p-4 border-t border-white/10"><a th:href="@{/auth/logout}" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-rose-300 hover:bg-rose-500/10 transition"><i class="fa-solid fa-power-off w-5"></i><span>Déconnexion</span></a></div>
    </aside>

    <div class="flex-grow flex flex-col overflow-hidden">
        <header class="h-20 bg-white/80 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-8 z-20 shadow-sm">
            <div class="flex items-center space-x-2">
                <h1 class="text-2xl font-bold text-univ-navy">Modifier mon profil</h1>
                <span class="text-slate-400">/</span>
                <span class="text-slate-500 font-medium text-sm">Formulaire d'édition</span>
            </div>
            <div class="flex items-center space-x-3">
                <div class="text-right hidden sm:block">
                    <span class="block text-sm font-bold text-univ-navy" th:text="${etudiant != null ? etudiant.nom + ' ' + etudiant.prenom : 'Étudiant'}">Étudiant</span>
                </div>
                <img class="w-10 h-10 rounded-full border-2 border-univ-gold object-cover shadow-sm" src="https://ui-avatars.com/api/?background=133054&color=bfa15f&bold=true&name=Student" alt="Avatar">
            </div>
        </header>

        <main class="flex-grow p-8 overflow-y-auto custom-scrollbar">
            <div class="content-card p-6 max-w-2xl mx-auto">
                <h2 class="text-xl font-bold text-univ-navy mb-4">Modifier mes informations</h2>
                <form th:action="@{/etudiant/profil/edit}" th:object="${profilRequest}" method="post" class="space-y-4">
                    <div th:if="${#fields.hasErrors('*')}" class="bg-red-100 text-red-700 p-3 rounded-lg text-sm">
                        <ul><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul>
                    </div>
                    <div><label class="block text-xs font-bold text-slate-600 uppercase">Nom *</label><input type="text" th:field="*{nom}" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-white/80"></div>
                    <div><label class="block text-xs font-bold text-slate-600 uppercase">Prénom *</label><input type="text" th:field="*{prenom}" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-white/80"></div>
                    <div><label class="block text-xs font-bold text-slate-600 uppercase">Email *</label><input type="email" th:field="*{email}" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-white/80"></div>
                    <div><label class="block text-xs font-bold text-slate-600 uppercase">Téléphone</label><input type="tel" th:field="*{telephone}" class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-white/80"></div>
                    <div><label class="block text-xs font-bold text-slate-600 uppercase">Matricule national</label><input type="text" th:field="*{matriculeNational}" class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-white/80"></div>
                    <div class="flex justify-end space-x-3 pt-4">
                        <a th:href="@{/etudiant/profil/view}" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl">Annuler</a>
                        <button type="submit" class="bg-univ-gold text-univ-navy font-bold px-6 py-2 rounded-xl shadow hover:bg-univ-goldLight transition">Enregistrer</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
