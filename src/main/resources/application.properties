spring.application.name=GestionTransfertEtudiant
# ==========================================
# SERVEUR
# ==========================================
server.port=8080
document.storage.path=./uploads
# ==========================================
# BASE DE DONNÉES H2
# ==========================================
spring.datasource.url=jdbc:h2:mem:transfert_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
logging.level.org.springframework.web=DEBUG
spring.main.allow-bean-definition-overriding=true


# Console H2 (accessible sur /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ==========================================
# THYMELEAF (vues MVC)
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false  
spring.thymeleaf.check-template-location=true

# ==========================================
# SPRING SECURITY
# ==========================================
# (aucune propriété obligatoire, mais on peut logger)
logging.level.org.springframework.security=DEBUG

# ==========================================
# JWT (pour l'API optionnelle)
# ==========================================
jwt.secret=0123456789012345678901234567890123456789012345678901234567890123  # au moins 64 caractères pour HS512
jwt.expirationMs=3600000
jwt.refreshExpirationMs=86400000
# ==========================================
# LOGGING
# ==========================================
logging.level.com.transfert=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuration SMTP (exemple avec Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=votre-email@gmail.com
spring.mail.password=votre-mot-de-passe
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Optionnel : désactiver la validation du certificat pour le développement
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
